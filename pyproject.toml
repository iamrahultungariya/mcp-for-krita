[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krita-mcp-lazy"
version = "0.1.0"
description = "ToonFlow Art Engine: Professional AI-assisted digital art production MCP server for Krita"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
krita-mcp = "krita_mcp_lazy.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
